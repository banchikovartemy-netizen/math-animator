[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"
[project]
name = "math-animator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["manim==0.19.0", "sympy==1.13.3", "numpy==2.2.4", "scipy==1.15.2", "matplotlib==3.10.1"]
[project.optional-dependencies]
dev = ["pytest==8.3.5"]
[project.scripts]
math-animator = "rendering.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
