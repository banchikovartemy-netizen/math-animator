name: Render mathematics
on:
  push:
    paths: ['scenes/**', 'examples/**', 'src/**', 'tests/**', 'pyproject.toml', 'requirements.lock', 'Dockerfile', '.github/workflows/render.yml', '.github/workflows/runtime.yml', '.github/scripts/**']
  workflow_dispatch:
    inputs:
      job:
        description: 'One job name; all explicitly requests the regression set'
        default: 'integral_graph'
        required: true
        type: string
      mode:
        default: 'final'
        type: choice
        options: ['preview', 'final']
      smoke:
        description: 'Short visual sample (preview profile only)'
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
concurrency:
  group: render-${{ github.ref }}-${{ inputs.job || 'changed' }}-${{ inputs.mode || 'preview' }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
      smoke: ${{ steps.plan.outputs.smoke }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          PYTHONPATH: src
          REQUESTED_JOB: ${{ inputs.job || 'changed' }}
          MODE: ${{ inputs.mode || 'preview' }}
          SMOKE: ${{ github.event_name == 'push' || inputs.smoke }}
          BEFORE: ${{ github.event.before }}
        run: python .github/scripts/plan.py
  runtime:
    needs: plan
    if: needs.plan.outputs.count != '0'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/runtime.yml
  checks:
    needs: [plan, runtime]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check once for the whole run
        env:
          IMAGE: ${{ needs.runtime.outputs.image }}
        run: docker run --rm --network none -v "$PWD:/app:ro" --entrypoint python "$IMAGE" -m pytest -q -p no:cacheprovider
  segment:
    needs: [plan, runtime, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      JOB: ${{ matrix.job }}
      SEGMENT: ${{ matrix.segment }}
      MODE: ${{ matrix.mode }}
      SMOKE: ${{ matrix.smoke }}
      IMAGE: ${{ needs.runtime.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: .cache/math-animator
          key: render-${{ runner.os }}-${{ matrix.runtime }}-${{ matrix.job }}-${{ matrix.segment }}-${{ matrix.mode }}-${{ matrix.smoke }}-${{ matrix.key }}
          restore-keys: |
            render-${{ runner.os }}-${{ matrix.runtime }}-${{ matrix.job }}-${{ matrix.segment }}-${{ matrix.mode }}-${{ matrix.smoke }}-
      - name: Render independent segment or reuse verified content
        run: |
          mkdir -p outputs .cache/math-animator
          chmod -R a+rwX outputs .cache/math-animator
          FLAGS=()
          if [ "$SMOKE" = true ]; then FLAGS+=(--smoke); fi
          docker run --rm --network none -v "$PWD:/app:ro" -v "$PWD/outputs:/app/outputs" -v "$PWD/.cache/math-animator:/app/.cache/math-animator" "$IMAGE" "$JOB" --mode "$MODE" --segment "$SEGMENT" "${FLAGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: segment-${{ matrix.job }}-${{ matrix.segment }}-${{ matrix.mode }}
          path: outputs
          retention-days: 7
          compression-level: 0
  assemble:
    needs: [plan, runtime, segment]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    env:
      JOB: ${{ matrix.job }}
      MODE: ${{ needs.plan.outputs.mode }}
      SMOKE: ${{ needs.plan.outputs.smoke }}
      IMAGE: ${{ needs.runtime.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: segment-${{ matrix.job }}-*
          path: downloaded
          merge-multiple: true
      - name: Join in order without reencoding and fully decode MP4
        run: |
          mkdir -p outputs
          chmod 777 outputs
          FLAGS=()
          if [ "$SMOKE" = true ]; then FLAGS+=(--smoke); fi
          docker run --rm --network none -v "$PWD:/app:ro" -v "$PWD/outputs:/app/outputs" "$IMAGE" "$JOB" --mode "$MODE" --assemble-from /app/downloaded "${FLAGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-${{ matrix.job }}-${{ env.MODE }}${{ env.SMOKE == 'true' && '-smoke' || '' }}
          path: outputs
          retention-days: 30
          compression-level: 0
      - name: Download link and timing
        run: echo 'Video, checked solution, cache hits and per-segment timings are in Artifacts/report.json.' >> "$GITHUB_STEP_SUMMARY"
